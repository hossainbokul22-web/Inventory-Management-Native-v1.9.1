<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F4E78">
<title>Daily PM Report</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1b2430; --muted:#5d6b7c; --line:#d9dfe7;
  --brand:#1F4E78; --brand-ink:#ffffff; --accent:#fff2cc; --ok:#1d7a46; --bad:#b3261e; --head:#e8eef5;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#10161d; --card:#18212b; --ink:#e7edf3; --muted:#9aa8b8; --line:#2b3948; --brand:#4f8fc9; --brand-ink:#0b1722; --accent:#3a3320; --ok:#53c585; --bad:#ff8a80; --head:#1f2c3a}
}
:root[data-theme=dark]{--bg:#10161d; --card:#18212b; --ink:#e7edf3; --muted:#9aa8b8; --line:#2b3948; --brand:#4f8fc9; --brand-ink:#0b1722; --accent:#3a3320; --ok:#53c585; --bad:#ff8a80; --head:#1f2c3a}
html.embed header{display:none}
html.embed nav{top:0}
*{box-sizing:border-box}

html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:17px;margin:0;font-weight:700}
#status{font-size:12px;opacity:.9;white-space:nowrap}
nav{position:sticky;top:46px;z-index:4;background:var(--card);border-bottom:1px solid var(--line);display:flex;overflow-x:auto}
nav button{flex:1 0 auto;min-height:46px;padding:0 16px;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;border-bottom:3px solid transparent;cursor:pointer}
nav button[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}
main{max-width:1100px;margin:0 auto;padding:14px;padding-bottom:max(40px,env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;min-height:46px;padding:9px 11px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px}
input.in,select.in,textarea.in{background:var(--accent)}
input[disabled]{opacity:.65}
.row{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(max-width:480px){.row.stack{grid-template-columns:1fr}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn{min-height:48px;padding:0 20px;border-radius:10px;border:0;background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:var(--head);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.name{margin-top:6px;font-weight:600;color:var(--brand);min-height:1.4em}
.msg{padding:10px 12px;border-radius:9px;margin-bottom:12px;font-size:14px}
.msg.err{background:color-mix(in srgb,var(--bad) 15%,var(--card));border:1px solid var(--bad)}
.msg.ok{background:color-mix(in srgb,var(--ok) 15%,var(--card));border:1px solid var(--ok)}
.msg.warn{background:var(--accent);border:1px solid var(--line)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:70vh;background:var(--card)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
th{position:sticky;top:0;background:var(--head);z-index:2;font-weight:700;white-space:normal;vertical-align:bottom}
td.l,th.l{text-align:left}
.sticky1{position:sticky;left:0;background:var(--card);z-index:1;white-space:normal;min-width:128px;max-width:160px;font-size:13px;line-height:1.3;border-right:1px solid var(--line);text-align:left}
th.sticky1{background:var(--head);z-index:3}
tr.tot td,tr.pre td{font-weight:700;background:var(--head)}
td.neg{color:var(--bad);font-weight:700}
.muted{color:var(--muted);font-size:13px}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .t{font-weight:600}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--head);font-size:12px;margin-left:6px}
td input{min-height:36px;padding:4px 8px;width:110px;text-align:right}
th.c{text-align:center}
td.itemname{white-space:normal;min-width:130px;max-width:190px;font-weight:600;vertical-align:top}
table.prod td input{width:88px}
table.prod td input.rt{width:96px;text-align:left}
input.ov{background:#ffd966;font-weight:700}
.mph{font-size:14px;margin:16px 0 6px}
table.mp td input{width:80px}
table.mp td input.mpname{width:150px;text-align:left}
table.mp th input.mphead{width:80px;text-align:right;font-weight:700;background:transparent}
.addbox{margin-top:12px;border:1.5px dashed var(--brand);border-radius:14px;background:color-mix(in srgb,var(--brand) 6%,transparent)}
.addbox[open]{border-style:solid}
.addsum{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;min-height:56px}
.addsum::before,details[open]>.addsum::before{content:none!important}
.addic{flex:none;width:38px;height:38px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1;font-weight:400}
.addbox[open] .addic{transform:rotate(45deg)}
.addtx{flex:1;display:flex;flex-direction:column;min-width:0}
.addtx b{color:var(--brand);font-size:16px}
.addtx small{color:var(--muted);font-size:13px;line-height:1.3;margin-top:2px}
.addch{flex:none;width:11px;height:11px;border-right:3px solid var(--brand);border-bottom:3px solid var(--brand);transform:rotate(-45deg);margin:0 6px;transition:transform .15s}
.addbox[open] .addch{transform:rotate(45deg)}
.pb2{display:flex;gap:8px;flex:none}.pb2 .btn{width:auto!important;white-space:nowrap}
.addbody{padding:0 14px 14px}
.addbody .btn{width:100%}
.addbody .btns .btn.sm{width:auto}
.pbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;color:var(--muted);font-size:14px}
.howto{margin-top:10px;font-size:14px}
.howto>summary{color:var(--muted)!important;cursor:pointer;min-height:32px;display:flex;align-items:center}
.howto>summary::before{content:'\24D8\00a0\00a0'!important;font-size:16px}
.howto ul{margin:4px 0 0;padding-left:20px;color:var(--muted)}.howto li{margin:3px 0}
.wn{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--accent);border:1px solid color-mix(in srgb,#e0a800 45%,transparent)}
.wn b{display:block;font-size:14px}.wn small{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:2px}
.wi{flex:none;width:22px;height:22px;border-radius:50%;background:#e0a800;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.pchecks{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
.pchk{display:flex;align-items:center;gap:10px;margin:0;padding:10px 12px;border-bottom:1px solid var(--line);color:var(--ink);font-size:15px;cursor:pointer}
.pchk:last-child{border-bottom:0}
.pchk input{width:22px;height:22px;min-height:0;flex:none}
details>summary{list-style:none;color:var(--brand)}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:'\25B8\00a0';margin-right:4px}
details[open]>summary::before{content:'\25BE\00a0'}
.rhead{margin:0 0 10px}
.rhead .co{font-weight:700;font-size:15px}
.rhead .rt{font-weight:700;color:var(--brand)}
.rhead .rs{color:var(--muted);font-size:13px}
.sign{display:none}
@media print{
  :root{--bg:#fff;--card:#fff;--ink:#000;--muted:#333;--line:#999;--brand:#1F4E78;--head:#e8eef5;--bad:#b3261e}
  @page{size:A4 landscape;margin:9mm}
  html,body{background:#fff;color:#000;font-size:10px}
  header,nav,.noprint{display:none!important}
  main{max-width:none;padding:0}
  .tw{border:0;max-height:none;overflow:visible;border-radius:0}
  table{font-size:7.5px;width:100%}
  table.wide{table-layout:fixed;font-size:6.5px}
  table.wide td:nth-child(1),table.wide th:nth-child(1){width:3.5%}
  table.wide td:nth-child(2),table.wide th:nth-child(2){width:17%}
  table.wide td:last-child,table.wide th:last-child{width:4.5%}
  table.wide td{overflow:hidden}
  table{line-height:1.05}
  th,td{padding:.6px 3px;border:.5px solid #888;white-space:normal}
  .sticky1{position:static;max-width:none;min-width:0;font-size:inherit;line-height:inherit;border-right:.5px solid #888}
  td{white-space:nowrap}
  th{position:static;background:var(--head)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr.tot td,tr.pre td{background:var(--head)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr{page-break-inside:avoid}
  thead{display:table-header-group}
  td.itemname{white-space:normal;font-weight:700}
  td input{border:0!important;background:none!important;padding:0;min-height:0;width:100%!important;font:inherit;text-align:right;color:#000}
  table.prod td input.rt{text-align:left}
  table.prod{font-size:7.5px}
  .mpwrap{page-break-inside:avoid;margin-top:8px}
  .mph{margin:6px 0 3px;font-size:9px}
  .mpwrap .tw{max-width:300px!important}
  .rhead .co{font-size:13px}
  .sign{display:flex;gap:30px;margin-top:14px;page-break-inside:avoid}
  .sign div{flex:1;border-top:1px solid #000;padding-top:3px;font-size:9px;text-align:center}
}
nav button{--tc:var(--brand);--ic:'\25CF'}
nav button::before{content:var(--ic);color:var(--tc);margin-right:7px;font-size:15px}
nav button[data-tab=entry]{--tc:#1d9a5b;--ic:'\FF0B'}
nav button[data-tab=daily]{--tc:#2457a6;--ic:'\25A4'}
nav button[data-tab=monthly]{--tc:#7b3fc4;--ic:'\25A6'}
nav button[data-tab=production]{--tc:#e07b00;--ic:'\25A3'}
nav button[data-tab=master]{--tc:#0f8a8a;--ic:'\25C6'}
nav button[data-tab=settings]{--tc:#546e7a;--ic:'\2699'}
nav button[data-tab=backup]{--tc:#c2185b;--ic:'\21E9'}
nav button[aria-selected=true]{color:var(--tc);border-bottom-color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,transparent)}
</style>
<script>try{if(window.AndroidPM){document.documentElement.classList.add('embed');document.documentElement.dataset.theme=AndroidPM.isDark()?'dark':'light';}}catch(e){}</script>

/* ---------- calculations ---------- */
function sumBy(list, code, pred) { let t = 0; for (const e of list) if (e.code === code && pred(e.date)) t += e.qty; return t; }
function useOf(item, pred) {   // item use = sum over recipe lines of (qty per ctn x ctn output of that product)
  let t = 0;
  for (const r of S.recipes) if (r.i === item) t += r.q * sumBy(S.output, r.p, pred);
  return t;
}
function stockRows(date) {
  return S.items.map(it => {
    const before = d => d < date, on = d => d === date;
    const open = it.open + sumBy(S.receive, it.code, before) + sumBy(S.ret, it.code, before) - useOf(it.code, before);
    const rc = sumBy(S.receive, it.code, on), rt = sumBy(S.ret, it.code, on), use = useOf(it.code, on);
    const total = open + rc + rt;
    return { code: it.code, name: it.name, uom: it.uom, open, rc, rt, total, use, actual: total - use };
  });
}
const MLIST = { receive: 'receive', use: null, output: 'output', delivery: 'delivery', hold: 'hold', reject: 'reject' };
function monthRows(ym, rep) {
  const [y, m] = ym.split('-').map(Number), days = new Date(y, m, 0).getDate();
  const isItem = rep === 'receive' || rep === 'use';
  const master = isItem ? S.items : S.products;
  const rows = master.map(x => {
    const vals = [];
    for (let d = 1; d <= days; d++) {
      const iso = ym + '-' + pad(d), on = k => k === iso;
      vals.push(rep === 'use' ? useOf(x.code, on) : sumBy(S[MLIST[rep]], x.code, on));
    }
    return { code: x.code, name: x.name, vals, total: vals.reduce((a, b) => a + b, 0) };
  });
  return { days, rows };
}

/* ---------- production report logic ---------- */
const kgPerCtn = c => { const f = S.fg[c]; return f && f.pcs > 0 && f.g > 0 ? f.pcs * f.g / 1000 : 0; };
const netCtn = (c, pred) => sumBy(S.output, c, pred) - sumBy(S.hold, c, pred) - sumBy(S.reject, c, pred) - sumBy(S.delivery, c, pred);
function openingOf(c, date) {   // latest typed opening on/before this date, then add each day's movement; none typed = 0 start
  let ad = null, av = 0;
  for (const k in S.openOv) { const [d, cc] = k.split('|'); if (+cc === c && d <= date && (ad === null || d > ad)) { ad = d; av = S.openOv[k]; } }
  return av + netCtn(c, d => d < date && (ad === null || d >= ad));
}
function prodModel(date) {
  const on = d => d === date, extra = S.prodShow[date] || [];
  const show = S.products.filter(p => { const c = p.code;
    return sumBy(S.output, c, on) || sumBy(S.hold, c, on) || sumBy(S.reject, c, on) || sumBy(S.delivery, c, on) || Math.abs(openingOf(c, date)) > 1e-9 || extra.includes(c); });
  let noShift = 0; const noKg = [];
  const by = (list, c, sh) => list.filter(e => e.code === c && e.date === date && (!sh || e.shift === sh)).reduce((a, e) => a + e.qty, 0);
  const blocks = show.map(p => {
    const c = p.code, kg = kgPerCtn(c);
    const rows = SHIFTS.map(sh => { const fg = by(S.output, c, sh), h = by(S.hold, c, sh), r = by(S.reject, c, sh);
      return { sh, fg, fgk: fg * kg, h, r, grand: (fg + h + r) * kg, run: S.runtime[date + '|' + c + '|' + sh] || '' }; });
    const fg = by(S.output, c), h = by(S.hold, c), r = by(S.reject, c), del = by(S.delivery, c), open = openingOf(c, date);
    const inShifts = rows.reduce((a, x) => a + x.fg + x.h + x.r, 0);
    if (Math.abs(fg + h + r - inShifts) > 1e-9) noShift += 1;
    if (!kg && (fg + h + r) > 0) noKg.push(p.name);
    return { p, rows, tot: { open, fg, fgk: fg * kg, h, r, grand: (fg + h + r) * kg, del, close: open + fg - h - r - del }, ov: (date + '|' + c) in S.openOv };
  });
  const g = { open: 0, fg: 0, fgk: 0, h: 0, r: 0, grand: 0, del: 0, close: 0 };
  blocks.forEach(b => Object.keys(g).forEach(k => g[k] += b.tot[k]));
  return { blocks, grand: g, noShift, noKg, mpm: getMP(date) };
}

function getMP(date) {

/* ---------- csv / download ---------- */
function csv(rows) { return '﻿' + rows.map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(',')).join('\r\n'); }
function download(name, data, type) {
  if (window.AndroidPM && AndroidPM.saveFile) {   /* inside the Android app: hand the file to the native Save/Share dialog */
    const blob = new Blob([data], { type: type || 'text/csv;charset=utf-8' }), fr = new FileReader();
    fr.onload = () => AndroidPM.saveFile(name, blob.type || 'application/octet-stream', String(fr.result).split(',')[1] || '');
    fr.readAsDataURL(blob); return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: type || 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
function reportCSV(R) {
  const body = R.rows.map(x => Array.isArray(x) ? x : x.r);
  const out = [[R.company], [R.title], [R.sub], R.cols.map(c => c.h), ...R.pre, ...body];
  if (R.total) out.push(R.total);

function makePDF(R) {

  const norm = x => Array.isArray(x) ? { r: x, k: 'row' } : x;

  const fs = Math.min(8, rh - 2.6);
  const chunks = []; for (let i = 0; i < allRows.length; i += perPage) chunks.push(allRows.slice(i, i + perPage));
  const head = b => { b.T(M, H - M - 11, R.company, 12, true); b.T(M, H - M - 25, R.title, 10, true, '0.12 0.31 0.47'); b.T(M, H - M - 38, R.sub, 8.5, false, '0.3 0.3 0.3'); };
  const pages = chunks.map(rows => {
    const b = pageBuilder(); head(b);
    let y = top; b.rect(M, y - hh, avail, hh, '0.91 0.93 0.96');
    R.cols.forEach((c, i) => {
      wrapText(c.h, cw[i] - 4, hfs, true).slice(0, hl).forEach((ln, k) => {
        const yy = y - 2 - hfs - k * (hfs + 1.6) + 1.2; b.T(c.left ? x0[i] + 2 : x0[i] + cw[i] - 2 - tw(ln, hfs, true), yy, ln, hfs, true); });
    });

    rows.forEach(({ r, k }) => {

  // manpower table after the main table (same page if it fits, otherwise a new page)
  if (R.manpower) {
    const mp = R.manpower, mrh = 11, need = 16 + (mp.rows.length + 1) * mrh, mw = [130, 60, 60];
    let last = pages[pages.length - 1];

    b.line(M, y, M + tot, y);
    rows.forEach(({ r, k }) => {
      if (k !== 'row') b.rect(M, y - mrh, tot, mrh, '0.91 0.93 0.96');
      r.forEach((v, i) => { const bold = k !== 'row', str = clip(v, mw[i] - 4, 7, bold); b.T(i === 0 ? mx[i] + 2 : mx[i] + mw[i] - 2 - tw(str, 7, bold), y - mrh + 3, str, 7, bold); });

  const sg = R.signs || [], n = sg.length || 1, bw = (avail - (n - 1) * 30) / n;
  const stamp = new Date(), gen = fmtDate(todayISO()) + ' ' + pad(stamp.getHours()) + ':' + pad(stamp.getMinutes());
  const streams = pages.map((pg, pi) => {
    const b = pg.b;
    if (pi === pages.length - 1) sg.forEach(([l, nm], k) => { const x = M + k * (bw + 30); b.line(x, M + 30, x + bw, M + 30); b.T(x + (bw - tw(l, 8, true)) / 2, M + 20, l, 8, true); if (nm) b.T(x + (bw - tw(nm, 8)) / 2, M + 33, nm, 8); });

  add('<< /Type /Pages /Kids [' + streams.map((_, i) => (5 + i * 2) + ' 0 R').join(' ') + '] /Count ' + streams.length + ' >>');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');

function prodUsage(code) { return { e: ['output', 'delivery', 'hold', 'reject'].reduce((a, k) => a + S[k].filter(x => x.code === code).length, 0), r: S.recipes.filter(r => r.p === code).length }; }

/* ---------- events ---------- */
function printReport() {
  const R = buildReport(), old = document.title;
  if (window.AndroidPM && AndroidPM.print) { AndroidPM.print(R.file); return; }
  document.title = R.file;
  const back = () => { document.title = old; window.removeEventListener('afterprint', back); };
  window.addEventListener('afterprint', back);
  window.print();
  setTimeout(back, 4000);
}
/* fingerprint lock (inside the Android app): Settings, Master tab and every delete ask first */
let _unlockedUntil = 0;
function gate(why, fn, fresh) {
  const on = window.AndroidPM && AndroidPM.authenticate && AndroidPM.guardOn && AndroidPM.guardOn();
  if (!on || (!fresh && Date.now() < _unlockedUntil)) { fn(); return; }
  window.__authOk = () => { _unlockedUntil = Date.now() + 180000; fn(); };
  AndroidPM.authenticate(why, !!fresh);
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  const d = b.dataset, fresh = !!(d.del || d.idel || d.pdel || d.rdel || b.id === 'wipe' || b.id === 'wipe-m');
  if (fresh || d.tab === 'master' || d.tab === 'settings') { gate(fresh ? 'Delete' : 'Unlock ' + d.tab, () => handleClick(ev), fresh); return; }
  handleClick(ev);
});
function handleClick(ev) {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.tab) { U.tab = b.dataset.tab; U.editId = null; U.editItem = null; U.editProd = null; render(); window.scrollTo(0, 0); }
  else if (b.dataset.type) { U.type = b.dataset.type; U.editId = null; render(); }
  else if (b.dataset.daily) { U.daily = b.dataset.daily; render(); }
  else if (b.dataset.msub) { U.msub = b.dataset.msub; U.editItem = null; U.editProd = null; render(); }
  else if (b.dataset.edit) { U.editId = +b.dataset.edit; render(); window.scrollTo(0, 0); }
  else if (b.id === 'cancel-edit') { U.editId = null; render(); }
  else if (b.dataset.del) {
    const id = +b.dataset.del, e = S[U.type].find(x => x.id === id);
    if (e && confirm('Delete ' + fmtDate(e.date) + ' · ' + e.code + ' · ' + fmt(e.qty) + '?')) { S[U.type] = S[U.type].filter(x => x.id !== id); save(); render(); }
  }
  else if (b.dataset.iedit) { U.editItem = +b.dataset.iedit; render(); window.scrollTo(0, 0); }
  else if (b.id === 'cancel-item') { U.editItem = null; render(); }
  else if (b.dataset.idel) {
    const c = +b.dataset.idel, u = itemUsage(c);
    if (u.e || u.r) { U.msg = { t: 'err', s: `Cannot delete item ${c}: it is used in ${u.e} receive/return entr${u.e === 1 ? 'y' : 'ies'} and ${u.r} recipe line${u.r === 1 ? '' : 's'}. Remove those first.` }; render(); window.scrollTo(0, 0); }
    else if (confirm('Delete item ' + c + ' · ' + itemName(c) + '?')) { S.items = S.items.filter(i => i.code !== c); save(); U.msg = { t: 'ok', s: 'Item deleted.' }; render(); }
  }
  else if (b.dataset.pedit) { U.editProd = +b.dataset.pedit; render(); window.scrollTo(0, 0); }
  else if (b.id === 'cancel-prod') { U.editProd = null; render(); }
  else if (b.dataset.pdel) {
    const c = +b.dataset.pdel, u = prodUsage(c);
    if (u.e || u.r) { U.msg = { t: 'err', s: `Cannot delete product ${c}: it is used in ${u.e} entr${u.e === 1 ? 'y' : 'ies'} and ${u.r} recipe line${u.r === 1 ? '' : 's'}. Remove those first.` }; render(); window.scrollTo(0, 0); }
    else if (confirm('Delete product ' + c + ' · ' + prodName(c) + '?')) { S.products = S.products.filter(p => p.code !== c); delete S.fg[c]; save(); U.msg = { t: 'ok', s: 'Product deleted.' }; render(); }
  }
  else if (b.dataset.rdel) {
    const r = S.recipes[+b.dataset.rdel];
    if (r && confirm('Delete this recipe line? Product ' + r.p + ' → item ' + r.i)) { S.recipes.splice(+b.dataset.rdel, 1); save(); render(); }
  }
  else if (b.id === 'p-add-btn' || b.id === 'p-all') {
    const codes = b.id === 'p-all' ? [...document.querySelectorAll('.p-chk')].map(x => +x.value) : [...document.querySelectorAll('.p-chk:checked')].map(x => +x.value);
    if (!codes.length) return;
    const cur = S.prodShow[U.prodDate] = S.prodShow[U.prodDate] || [];
    codes.forEach(c => { if (!cur.includes(c)) cur.push(c); });
    save(); U.msg = { t: 'ok', s: codes.length + ' item' + (codes.length === 1 ? '' : 's') + ' added to this report.' }; render();
  }
  else if (b.id === 'p-selall' || b.id === 'p-clear') {
    document.querySelectorAll('.p-chk').forEach(x => x.checked = b.id === 'p-selall'); updPCount();
  }
  else if (b.dataset.mpdel != null) { const m = editMP(U.prodDate); m.rows.splice(+b.dataset.mpdel, 1); save(); render(); }
  else if (b.id === 'mp-addrow') { const m = editMP(U.prodDate); m.rows.push({ n: '', c1: '', c2: '' }); save(); render(); }
  else if (b.id === 'mp-reset') { if (confirm('Reset the manpower table of this date to the default rows and headings? Typed numbers for this date will be cleared.')) { delete S.mpx[U.prodDate]; delete S.manpower[U.prodDate]; save(); render(); } }
  else if (b.id === 'p-reset') { delete S.prodShow[U.prodDate]; save(); render(); }
  else if (b.id === 'do-print') printReport();
  else if (b.id === 'do-pdf') { const R = buildReport(); download(R.file + '.pdf', makePDF(R), 'application/pdf'); }
  else if (b.id === 'do-csv') { const R = buildReport(); download(R.file + '.csv', reportCSV(R)); }
  else if (b.id === 'set-reset') {
    if (confirm('Reset all tab, form, report and column names to their defaults? Company name and Prepared by are kept.')) { S.labels = {}; save(); U.msg = { t: 'ok', s: 'Names reset to default.' }; render(); }
  }
  else if (b.id === 'guard-toggle') { window.__authOk = () => render(); AndroidPM.toggleGuard(); }
  else if (b.id === 'bk-export') { S.lastBackup = Date.now(); save(); download('daily-pm-backup-' + todayISO() + '.json', JSON.stringify(S), 'application/json'); render(); }
  else if (b.dataset.csv) {
    const t = b.dataset.csv, ty = TY[t];
    download(t + '-' + todayISO() + '.csv', csv([['Date', ty.kind === 'item' ? 'Item Code' : 'Product Code', 'Name', 'Quantity', ...(ty.shift ? ['Shift'] : []), ...(ty.voucher ? ['Voucher'] : []), 'Note'],
      ...S[t].map(e => [e.date, e.code, ty.kind === 'item' ? itemName(e.code) : prodName(e.code), e.qty, ...(ty.shift ? [e.shift || ''] : []), ...(ty.voucher ? [e.voucher || ''] : []), e.note || ''])]));
  }
  else if (b.id === 'wipe-m') {
    const m = (document.getElementById('wipe-month') || {}).value || '';
    if (!/^\d{4}-\d{2}$/.test(m)) { U.msg = { t: 'err', s: 'Pick a month first.' }; render(); return; }
    if (confirm('Delete every entry of ' + m + '? This cannot be undone.') && confirm('Are you sure? Have you downloaded a backup?')) {
      let n = 0;
      LISTS.forEach(k => { const before = S[k].length; S[k] = S[k].filter(e => !String(e.date).startsWith(m)); n += before - S[k].length; });
      ['openOv', 'runtime'].forEach(k => { for (const key in S[k]) if (key.startsWith(m)) delete S[k][key]; });
      ['manpower', 'mpx'].forEach(k => { for (const key in S[k]) if (key.startsWith(m)) delete S[k][key]; });
      save(); U.msg = { t: 'ok', s: n + ' entries of ' + m + ' deleted.' }; render();
    }
  }
  else if (b.id === 'wipe') {
    if (confirm('All entries will be deleted. Continue?') && confirm('Are you sure? Have you downloaded a backup?')) {
      LISTS.forEach(k => S[k] = []); S.openOv = {}; S.runtime = {}; S.manpower = {}; S.mpx = {}; S.prodShow = {}; save(); U.msg = { t: 'ok', s: 'All entries deleted.' }; render();
    }
  }
}
document.addEventListener('input', ev => {

function updPCount() {
  const n = document.querySelectorAll('.p-chk:checked').length, b = $('#p-add-btn');
  if (b) { b.textContent = 'Add selected (' + n + ')'; b.disabled = !n; }
}
document.addEventListener('change', ev => {
  const t = ev.target, d = t.dataset || {};
  if (t.classList && t.classList.contains('p-chk')) updPCount();
  else if (t.id === 'f-code') showName();
  else if (t.id === 'f-date') U.date = t.value;
  else if (t.id === 'f-shift') U.shift = t.value;
  else if (t.id === 'sd') { U.stockDate = t.value || todayISO(); render(); }
  else if (t.id === 'pd') { U.prodDate = t.value || todayISO(); render(); }
  else if (t.id === 'mm') { U.month = t.value || todayISO().slice(0, 7); render(); }
  else if (t.id === 'mr') { U.rep = t.value; render(); }
  else if (d.rq != null) {
    const v = num(t.value), r = S.recipes[+d.rq];
    if (r && isFinite(v) && v >= 0) { r.q = v; save(); } else if (r) t.value = r.q;
  }
  else if (d.fgp != null || d.fgg != null) {
    const c = +(d.fgp ?? d.fgg), key = d.fgp != null ? 'pcs' : 'g', v = num(t.value);
    const f = S.fg[c] = S.fg[c] || { pcs: 0, g: 0 };
    f[key] = isFinite(v) && v > 0 ? v : 0; if (!f[key]) t.value = '';
    save(); const cell = $('#fgkg-' + c); if (cell) cell.innerHTML = '<b>' + (kgPerCtn(c) ? fmt(kgPerCtn(c)) : '—') + '</b>';
  }
  else if (d.open != null) {
    const c = +d.open, k = U.prodDate + '|' + c;
    if (String(t.value).trim() === '') delete S.openOv[k];
    else { const v = num(t.value); if (isFinite(v)) S.openOv[k] = v; }
    save(); render();
  }
  else if (d.run != null) { const [c, sh] = d.run.split('|'); const k = U.prodDate + '|' + c + '|' + sh; if (t.value.trim()) S.runtime[k] = t.value.trim(); else delete S.runtime[k]; save(); }
  else if (d.mp != null) {
    const [i, col] = d.mp.split('|'); const m = editMP(U.prodDate); if (m.rows[+i]) m.rows[+i][col] = t.value.trim(); save(); updMPTot();
  }
  else if (d.mph != null) { const m = editMP(U.prodDate); m.h[+d.mph] = t.value.trim(); save(); }
  else if (d.mpn != null) { const m = editMP(U.prodDate); if (m.rows[+d.mpn]) m.rows[+d.mpn].n = t.value.trim(); save(); }
  else if (t.id === 'bk-import') {
    const f = t.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const x = JSON.parse(rd.result);
        if (!x || !['items', 'products', 'recipes', 'receive', 'ret', 'output', 'delivery'].every(k => Array.isArray(x[k]))) throw new Error('bad');
        if (!confirm('All current data will be replaced by this backup. Continue?')) return;
        S = migrate(x); save(); U.msg = { t: 'ok', s: 'Data restored from backup.' }; render();
      } catch (e) { U.msg = { t: 'err', s: 'This is not a valid backup file.' }; render(); }
    };
    rd.readAsText(f);
  }
});
document.addEventListener('submit', ev => {
  ev.preventDefault();
  const id = ev.target.id;
  if (id === 'form') {
    const t = TY[U.type], date = $('#f-date').value, code = +$('#f-code').value, qty = num($('#f-qty').value);
    const errs = [];
    if (!date) errs.push('Enter a date');
    if (!code) errs.push('Select a code');
    if (!(qty > 0) || !isFinite(qty)) errs.push('Quantity must be greater than zero');
    if (errs.length) { $('#form-msg').innerHTML = '<div class="msg err" style="margin-top:12px">' + esc(errs.join(' · ')) + '</div>'; return; }
    const rec = { date, code, qty, voucher: t.voucher ? $('#f-vo').value.trim() : '', note: $('#f-note').value.trim() };
    if (t.shift) rec.shift = $('#f-shift').value;
    if (U.editId) { const e = S[U.type].find(x => x.id === U.editId); if (e) Object.assign(e, rec); U.editId = null; }
    else S[U.type].push({ id: S.nextId++, ...rec });
    U.date = date; if (t.shift && rec.shift) U.shift = rec.shift; save();
    U.msg = { t: 'ok', s: tl(U.type) + ' saved: ' + fmtDate(date) + ' · ' + code + ' · ' + fmt(qty) + (t.shift ? ' · Shift ' + (rec.shift || '—') : '') };
    render();
  } else if (id === 'item-form') {
    const editing = U.editItem != null, code = editing ? U.editItem : parseInt($('#mi-code').value, 10);
    const name = $('#mi-name').value.trim(), uom = $('#mi-uom').value.trim() || 'kg', open = num($('#mi-open').value || '0');
    const errs = [];
    if (!(code > 0)) errs.push('Item code must be a positive whole number');
    if (!editing && S.items.some(i => i.code === code)) errs.push('Item code ' + code + ' already exists');
    if (!name) errs.push('Enter the item name');
    if (!isFinite(open)) errs.push('Opening balance must be a number');
    if (errs.length) { U.msg = { t: 'err', s: errs.join(' · ') }; render(); return; }
    if (editing) Object.assign(S.items.find(i => i.code === code), { name, uom, open });
    else S.items.push({ code, name, uom, open });
    S.items.sort((a, b) => a.code - b.code); U.editItem = null; save();
    U.msg = { t: 'ok', s: (editing ? 'Item updated: ' : 'Item added: ') + code + ' · ' + name }; render();
  } else if (id === 'prod-form') {
    const editing = U.editProd != null, code = editing ? U.editProd : parseInt($('#mp-code').value, 10), name = $('#mp-name').value.trim();
    const errs = [];
    if (!(code > 0)) errs.push('Product code must be a positive whole number');
    if (!editing && S.products.some(p => p.code === code)) errs.push('Product code ' + code + ' already exists');
    if (!name) errs.push('Enter the product name');
    if (errs.length) { U.msg = { t: 'err', s: errs.join(' · ') }; render(); return; }
    if (editing) S.products.find(p => p.code === code).name = name; else S.products.push({ code, name });
    S.products.sort((a, b) => a.code - b.code); U.editProd = null; save();
    U.msg = { t: 'ok', s: (editing ? 'Product updated: ' : 'Product added: ') + code + ' · ' + name }; render();
  } else if (id === 'radd') {
    const p = +$('#ra-p').value, i = +$('#ra-i').value, q = num($('#ra-q').value);
    if (!p || !i || !(q >= 0) || !isFinite(q)) { U.msg = { t: 'err', s: 'Select a product, an item and enter a valid quantity' }; render(); return; }
    S.recipes.push({ p, i, q }); S.recipes.sort((a, b) => a.p - b.p); save(); U.msg = { t: 'ok', s: 'Recipe line added' }; render();
  } else if (id === 'set-form') {
    S.settings.company = $('#s-company').value.trim() || DEFAULT_SETTINGS.company; S.settings.preparedBy = $('#s-preparedBy').value.trim();
    document.querySelectorAll('[data-lab]').forEach(el => { const k = el.dataset.lab, v = el.value.trim(); if (v && v !== DL[k]) S.labels[k] = v; else delete S.labels[k]; });
    save(); U.msg = { t: 'ok', s: 'Settings saved' }; render();
  }
});

render();

</script>
</body>
